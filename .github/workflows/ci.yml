name: RightsRail CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: python -m pip install --requirement requirements-dev.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:compile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run genvm:ci
      - run: pnpm run test:pytest
      - run: pnpm run test:python
      - run: pnpm run typecheck:ts
      - run: pnpm run test:ts
      - run: pnpm run test:deployment
      - run: pnpm run verify:studionet
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
      - run: python tools/verify_release_invariants.py

  stable-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-studionet.txt
      - run: python tools/verify_studionet_genvm.py
      - run: python -m pytest -c tests_studionet/pytest.ini --confcutdir=tests_studionet tests_studionet -q

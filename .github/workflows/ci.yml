name: RightsRail CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - run: python -m pip install --requirement requirements-dev.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:compile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run genlayer:lint
      - run: pnpm run genlayer:validate
      - run: pnpm run genlayer:typecheck
      - run: pnpm run genlayer:schema
      - run: pnpm run test:pytest
      - run: pnpm run typecheck:ts
      - run: pnpm run test:ts
      - run: pnpm run test:deployment
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser

  release-invariants:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_release_invariants.py

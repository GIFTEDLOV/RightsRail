[project]
name = "rightsrail"
version = "0.1.0"
description = "Semantic usage-rights enforcement on GenLayer"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.168.5",
  "ruff==0.16.10",
  "mypy==2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages/domain",
  "packages/shared",
  "packages/evidence",
  "packages/media-analysis",
  "packages/policy-engine",
  "packages/genlayer-client",
  "packages/indexer",
  "packages/workflow",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The proven GenLayer contract dialect requires the SDK's star import. The
# contract is validated by genvm-lint against the pinned runtime bundle.
"contracts/rightsrail.py" = ["E501", "F403", "F405", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = [
  "packages/domain",
  "packages/shared",
  "packages/evidence",
  "packages/media-analysis",
  "packages/policy-engine",
  "packages/genlayer-client",
]

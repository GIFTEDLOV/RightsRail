[project]
name = "rightsrail"
version = "0.1.0"
description = "Semantic usage-rights enforcement on GenLayer"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.168.5",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "genvm-linter==0.11.1rc2",
  "pyright==1.1.414",
  "genlayer-py==0.19.0rc2",
  "genlayer-test==0.30.0rc2",
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--artifacts-dir", ".genlayer-cache/gltest-artifacts"]
pythonpath = [
  ".",
  "packages/domain",
  "packages/shared",
  "packages/evidence",
  "packages/media-analysis",
  "packages/policy-engine",
  "packages/genlayer-client",
  "packages/indexer",
  "packages/workflow",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web/node_modules", "rightsrail_deployed.py", ".glsim-home"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The contract is validated by genvm-lint against the pinned RC5 runtime
# bundle. E010 is a known static reachability false positive for valid
# gl.nondet calls in RC5 and is recorded in the Phase 2.5 audit.
"contracts/rightsrail.py" = ["E501", "I001"]
"contracts/rightsrail_v24.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = [
  "packages/domain",
  "packages/shared",
  "packages/evidence",
  "packages/media-analysis",
  "packages/policy-engine",
  "packages/genlayer-client",
]
